<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Kamera fotó feltöltés (320x240 / 240x320)</title>
<style>
  :root { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; background: #111; color: #eee; }
  .container { padding: 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .preview-wrap { position: relative; width: 100%; max-width: 680px; aspect-ratio: 3/4; background: #000; display:flex; justify-content:center; align-items:center; overflow:hidden; border-radius: 10px; }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(1); }
  canvas { display:none; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  button, select, input[type="text"] { padding: 10px 14px; border-radius:8px; border: none; background:#2b2b2b; color:#fff; font-size:14px; }
  button:active { transform: translateY(1px); }
  .thumb { width: 160px; height: 120px; object-fit: cover; border-radius:6px; border:1px solid #333; }
  .status { font-size:13px; color:#bbb; min-height:18px; text-align:center; }
  .row { display:flex; gap:8px; align-items:center; }
  label { font-size:13px; color:#ccc; }
  @media (orientation:portrait) {
    .preview-wrap { aspect-ratio: 3/4; }
  }
  @media (orientation:landscape) {
    .preview-wrap { aspect-ratio: 16/9; }
  }
</style>
</head>
<body>
  <div class="container">
    <h2 style="margin:0 0 8px 0;">Kamera fotó küldés (320×240 / 240×320)</h2>

    <div class="preview-wrap" id="previewWrap">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
      <button id="flipBtn" title="Elől/hátlapi váltás">Váltás</button>
      <button id="captureBtn">Fotó készítése</button>
      <button id="sendBtn" disabled>Feltöltés</button>
      <button id="downloadBtn" disabled>Letöltés</button>
    </div>

    <div class="row" style="gap:12px;">
      <img id="thumb" class="thumb" alt="Előnézet"/>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <div class="status" id="status">Kamera inicializálása…</div>
        <label>
          Feltöltési URL:
          <input id="uploadUrlInput" type="text" placeholder="https://példa.hu/upload" style="width:280px"/>
        </label>
      </div>
    </div>

    <div style="font-size:12px;color:#aaa;max-width:720px;text-align:left;margin-top:6px;">
      A fotó középről lesz kivágva úgy, hogy megtartsa a cél képarányt (4:3). Ha a készülék tájolása nagyobb, lesz 320×240; ha függőleges, 240×320. A feltöltés `file` mezőben küldi a JPEG-t.
    </div>
  </div>

<script>
(async function(){
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const thumb = document.getElementById('thumb');
  const statusEl = document.getElementById('status');
  const captureBtn = document.getElementById('captureBtn');
  const sendBtn = document.getElementById('sendBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const flipBtn = document.getElementById('flipBtn');
  const uploadUrlInput = document.getElementById('uploadUrlInput');

  // Alapértelmezett feltöltési URL - cseréld ki
  uploadUrlInput.value = 'https://example.com/upload';

  let stream = null;
  let useFacingMode = 'environment'; // 'user' for front camera
  let currentBlob = null;

  async function startCamera() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    const constraints = {
      audio: false,
      video: {
        facingMode: { ideal: useFacingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    };
    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      statusEl.textContent = 'Kamera készen.';
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'Kamera hiba: ' + (err.message || err.name);
    }
  }

  // Flip kamera (front/back)
  flipBtn.addEventListener('click', async () => {
    useFacingMode = (useFacingMode === 'environment') ? 'user' : 'environment';
    statusEl.textContent = 'Kamera váltás…';
    await startCamera();
  });

  // Capture and process
  captureBtn.addEventListener('click', () => {
    if (!stream) { statusEl.textContent = 'Nincs kamera.'; return; }
    captureAndProcess();
  });

  downloadBtn.addEventListener('click', () => {
    if (!currentBlob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(currentBlob);
    a.download = 'photo.jpg';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  async function captureAndProcess() {
    statusEl.textContent = 'Feldolgozás…';
    // Videó aktuális képméretei
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh) { statusEl.textContent = 'Nem érkezett kép a kamerából.'; return; }

    // Döntsük el a célméretet a kamera (vagy képméret) arányától
    // Ha a képarány szélesebb mint magas => landscape -> 320x240 (4:3)
    // különben portrait -> 240x320 (3:4)
    const isLandscape = vw >= vh;
    const targetW = isLandscape ? 320 : 240;
    const targetH = isLandscape ? 240 : 320;
    const targetAspect = targetW / targetH;

    // A forrásképből (vw x vh) középről vágjunk egy olyan területet, ami a cél arányt követi.
    const srcAspect = vw / vh;
    let sx, sy, sWidth, sHeight;
    if (srcAspect > targetAspect) {
      // forrás túl széles -> szélekből vágunk
      sHeight = vh;
      sWidth = Math.round(vh * targetAspect);
      sx = Math.round((vw - sWidth) / 2);
      sy = 0;
    } else {
      // forrás túl magas vagy pontos -> tetejéből/aljáról vágunk
      sWidth = vw;
      sHeight = Math.round(vw / targetAspect);
      sx = 0;
      sy = Math.round((vh - sHeight) / 2);
    }

    // Állítsuk be a canvas méretét a pontos célméretre
    canvas.width = targetW;
    canvas.height = targetH;
    const ctx = canvas.getContext('2d');

    // Rajzoljuk át a kivágott részt a target méretre (ez végzi az átméretezést is)
    ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, targetW, targetH);

    // Opció: kompresszió minősége 0.9
    canvas.toBlob((blob) => {
      currentBlob = blob;
      const url = URL.createObjectURL(blob);
      thumb.src = url;
      sendBtn.disabled = false;
      downloadBtn.disabled = false;
      statusEl.textContent = `Kész: ${targetW}×${targetH} (${Math.round(blob.size/1024)} KB)`;
    }, 'image/jpeg', 0.9);
  }

  // Feltöltés
  sendBtn.addEventListener('click', async () => {
    if (!currentBlob) { statusEl.textContent = 'Nincs kép feltöltésre.'; return; }
    const uploadUrl = (uploadUrlInput.value || '').trim();
    if (!uploadUrl) { statusEl.textContent = 'Add meg a feltöltési URL-t.'; return; }

    sendBtn.disabled = true;
    statusEl.textContent = 'Feltöltés…';

    try {
      const form = new FormData();
      // A backend oldalon a file mezőt kell kezelni; nevet megadhatod (photo.jpg)
      form.append('file', currentBlob, 'photo.jpg');

      // opcionális további mezők:
      // form.append('source','mobile');
      const resp = await fetch(uploadUrl, {
        method: 'POST',
        body: form,
        // Ne add hozzá a Content-Type-ot kézzel; a fetch beállítja a boundary-t.
      });

      if (!resp.ok) {
        const text = await resp.text().catch(()=>null);
        statusEl.textContent = `Sikertelen: ${resp.status} ${resp.statusText}` + (text ? ` — ${text}` : '');
      } else {
        const ct = resp.headers.get('content-type') || '';
        let bodyText = '';
        if (ct.includes('application/json')) {
          const j = await resp.json(); bodyText = JSON.stringify(j);
        } else {
          bodyText = await resp.text().catch(()=>'<nem olvasható válasz>');
        }
        statusEl.textContent = 'Feltöltés sikeres.';
        console.log('Server response:', bodyText);
      }
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'Hiba feltöltés közben: ' + (err.message || err);
    } finally {
      sendBtn.disabled = false;
    }
  });

  // Indítsuk a kamerát automatikusan
  await startCamera();

  // Ha a videó tájolása változik, frissül a preview (nem kötelező)
  video.addEventListener('loadedmetadata', () => {
    // nothing for now, kept for potenciális további logika
  });

  // Mobil safari: kérhetjük a képernyő orientációt, de hagyjuk a böngészőre
})();
</script>
</body>
</html>
